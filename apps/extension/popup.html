<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.5 system-ui, sans-serif; width: 260px; margin: 0; padding: 14px;
         background: #fcfcfb; color: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a19; color: #fff; }
    input[type=text] { background: #1a1a19; color: #fff; border-color: #383835; }
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .tag { color: #898781; font-size: 11.5px; margin: 0 0 12px; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
  input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid #c3c2b7;
                     border-radius: 6px; font: inherit; box-sizing: border-box; }
  #apiRow { display: none; }
  .note { font-size: 11.5px; color: #898781; margin-top: 10px; }
</style>
</head>
<body>
  <h1>ManipuLens</h1>
  <p class="tag">Techniques, not truth.</p>

  <label>
    <input type="radio" name="mode" value="local" id="modeLocal">
    <span><strong>Private (in-browser)</strong> — headlines never leave your machine</span>
  </label>
  <label>
    <input type="radio" name="mode" value="server" id="modeServer">
    <span>Server API</span>
  </label>
  <div id="apiRow">
    <input type="text" id="apiUrl" placeholder="http://localhost:8000">
  </div>

  <p class="note">Verify privacy mode yourself: devtools → Network shows zero requests.</p>
  <script src="popup.js"></script>
</body>
</html>
